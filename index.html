<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🪙 Кликер v3.0</title>
<style>
:root {
  --gold: #ffd86b;
  --purple: #7c4dff;
  --purple-d: #4a2bd6;
  --green: #2ecc71;
  --red: #ff4d6d;
  --bg-1: #2a1f5e;
  --bg-2: #12101f;
  --bg-3: #08070d;
  --card-bg: rgba(255,255,255,.045);
  --card-border: rgba(255,255,255,.08);
  --text-1: #e9e9f5;
  --text-2: #8f8ba8;
  --text-3: #b8b4cc;
}
body.theme-dark { --bg-1: #2a1f5e; --bg-2: #12101f; --bg-3: #08070d; --text-1: #e9e9f5; --text-2: #8f8ba8; --card-bg: rgba(255,255,255,.045); --card-border: rgba(255,255,255,.08); }
body.theme-light { --bg-1: #f0e6ff; --bg-2: #e8e0f5; --bg-3: #d8d0e8; --text-1: #2a1f5e; --text-2: #6a5a8a; --text-3: #4a3d6a; --card-bg: rgba(0,0,0,.04); --card-border: rgba(0,0,0,.1); }
body.theme-neon { --bg-1: #0a0a1a; --bg-2: #05050f; --bg-3: #000005; --text-1: #00ffcc; --text-2: #00aa88; --text-3: #00ddb0; --card-bg: rgba(0,255,200,.06); --card-border: rgba(0,255,200,.2); }
body.theme-sunset { --bg-1: #6b2c4a; --bg-2: #3d1a2e; --bg-3: #1a0a15; --text-1: #ffd0c0; --text-2: #c09a90; --card-bg: rgba(255,150,100,.08); --card-border: rgba(255,150,100,.2); }
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; max-width: 100vw; overflow-x: hidden; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: radial-gradient(circle at 50% -20%, var(--bg-1) 0%, var(--bg-2) 45%, var(--bg-3) 100%);
  color: var(--text-1); min-height: 100vh; user-select: none; transition: background .3s; padding-bottom: 60px;
}
#particles { position: fixed; inset: 0; pointer-events: none; z-index: 400; }
#notifications { position: fixed; top: 20px; right: 20px; z-index: 2000; display: flex; flex-direction: column; gap: 10px; pointer-events: none; max-width: 300px; }
.notification { background: linear-gradient(135deg, rgba(30,25,50,.98), rgba(20,17,35,.98)); border: 1px solid rgba(140,110,255,.4); border-radius: 12px; padding: 10px 14px; color: #fff; font-size: 13px; font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,.6); animation: notifIn .3s cubic-bezier(.2,.7,.4,1); pointer-events: auto; }
.notification.achievement { background: linear-gradient(135deg, rgba(255,215,0,.15), rgba(255,140,0,.15)); border-color: var(--gold); color: var(--gold); }
.notification.golden { border-color: #ffd700; background: linear-gradient(135deg, rgba(255,215,0,.2), rgba(255,140,0,.1)); color: #ffe066; }
.notification.quest { border-color: var(--green); background: linear-gradient(135deg, rgba(46,204,113,.15), rgba(46,204,113,.08)); color: #7dffb0; }
.notification.out { animation: notifOut .3s forwards; }
@keyframes notifIn { from { opacity: 0; transform: translateX(50px); } to { opacity: 1; transform: none; } }
@keyframes notifOut { to { opacity: 0; transform: translateX(50px); } }
.golden-coin { position: fixed; width: 70px; height: 70px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #fff5b0, #ffd700 50%, #ff8c00 100%); box-shadow: 0 0 40px rgba(255,215,0,.9); display: flex; align-items: center; justify-content: center; font-size: 34px; cursor: pointer; z-index: 500; animation: goldenPulse 1s infinite; border: 3px solid #fffbe0; }
.golden-coin.hidden { display: none; }
@keyframes goldenPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
.app { max-width: 1180px; margin: 0 auto; padding: 20px 16px 40px; display: grid; grid-template-columns: 1fr; gap: 24px; align-items: start; position: relative; z-index: 10; width: 100%; }
.left-panel { text-align: center; position: static; margin-bottom: 20px; }
h1#logo { font-size: 22px; letter-spacing: 2px; font-weight: 800; background: linear-gradient(90deg, var(--gold), #ff9d00, var(--gold)); -webkit-background-clip: text; background-clip: text; color: transparent; cursor: pointer; display: inline-block; margin-bottom: 6px; }
.player-info { display: inline-flex; gap: 8px; align-items: center; background: rgba(124,77,255,.12); border: 1px solid rgba(124,77,255,.3); border-radius: 10px; padding: 4px 10px; font-size: 11px; font-weight: 700; color: #c4b5fd; margin-bottom: 8px; }
.player-info b { color: #ffd86b; }
.coin-count { font-size: 42px; font-weight: 800; color: var(--text-1); text-shadow: 0 0 24px rgba(255,200,60,.55); line-height: 1.1; }
.coin-label { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-2); margin-bottom: 10px; }
.click-btn { width: 200px; height: 200px; border-radius: 50%; border: none; cursor: pointer; background: radial-gradient(circle at 34% 28%, #fff2b0, #ffbe2e 42%, #d17b00 100%); box-shadow: 0 0 45px rgba(255,183,0,.45), inset 0 -10px 24px rgba(120,60,0,.35), inset 0 8px 18px rgba(255,255,255,.5); font-size: 84px; display: flex; align-items: center; justify-content: center; margin: 4px auto 12px; transition: transform .07s ease; line-height: 1; position: relative; will-change: transform; }
.click-btn:active { transform: scale(.93); }
.click-btn.skin-default { background: radial-gradient(circle at 34% 28%, #fff2b0, #ffbe2e 42%, #d17b00 100%); }
.click-btn.skin-diamond { background: radial-gradient(circle at 34% 28%, #e0f7ff, #4dd0e1 42%, #0097a7 100%); box-shadow: 0 0 45px rgba(80,220,255,.6), inset 0 -10px 24px rgba(0,80,120,.4), inset 0 8px 18px rgba(255,255,255,.5); }
.click-btn.skin-fire { background: radial-gradient(circle at 34% 28%, #fff3b0, #ff6b35 42%, #c9184a 100%); box-shadow: 0 0 45px rgba(255,80,40,.6), inset 0 -10px 24px rgba(120,20,20,.4), inset 0 8px 18px rgba(255,200,150,.5); }
.click-btn.skin-galaxy { background: radial-gradient(circle at 34% 28%, #e0d0ff, #7c4dff 42%, #2a1a5e 100%); box-shadow: 0 0 45px rgba(180,120,255,.6), inset 0 -10px 24px rgba(40,20,80,.4), inset 0 8px 18px rgba(220,200,255,.5); }
.combo-bar { width: 200px; height: 7px; background: rgba(255,255,255,.07); border-radius: 4px; margin: 0 auto 10px; overflow: hidden; }
.combo-fill { height: 100%; background: linear-gradient(90deg, #ff6b35, #ffd700, #ff6b35); width: 0%; transition: width .15s ease; }
.combo-indicator { display: inline-block; font-weight: 800; font-size: 14px; color: #ffd700; margin-bottom: 10px; min-height: 18px; text-shadow: 0 0 10px rgba(255,180,0,.7); }
.hud { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.hud-item { background: rgba(255,255,255,.055); border: 1px solid rgba(255,255,255,.09); border-radius: 10px; padding: 6px 12px; font-size: 13px; font-weight: 700; color: var(--gold); min-width: 90px; }
.hud-label { display: block; font-size: 9px; letter-spacing: 1px; text-transform: uppercase; color: var(--text-2); font-weight: 600; margin-bottom: 2px; }
.tabs { display: flex; gap: 4px; margin-bottom: 12px; background: rgba(255,255,255,.04); padding: 5px; border-radius: 12px; border: 1px solid rgba(255,255,255,.07); flex-wrap: wrap; justify-content: center; }
.tab { flex: 1; min-width: 40px; padding: 9px 5px; border: none; border-radius: 9px; background: transparent; color: #9d99b8; font-size: 12px; font-weight: 700; cursor: pointer; transition: .15s; font-family: inherit; }
.tab.active { background: linear-gradient(135deg, var(--purple), var(--purple-d)); color: #fff; }
.tab-content { display: none; animation: fade .2s ease; }
.tab-content.active { display: block; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.tier-title { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-2); font-weight: 700; margin: 14px 0 6px; padding-left: 4px; }
.tier-title:first-child { margin-top: 0; }
.shop { display: flex; flex-direction: column; gap: 6px; }
.card { display: flex; align-items: center; gap: 10px; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 10px 12px; transition: .15s; }
.card:hover { border-color: rgba(140,110,255,.45); }
.card.maxed { opacity: .55; }
.card-icon { font-size: 22px; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,.06); border-radius: 9px; flex-shrink: 0; }
.card-info { flex: 1; min-width: 0; }
.card-name { font-weight: 700; font-size: 13px; margin-bottom: 2px; }
.lvl { font-size: 9px; font-weight: 700; color: #a78bfa; background: rgba(124,77,255,.18); padding: 1px 5px; border-radius: 20px; margin-left: 4px; vertical-align: middle; }
.card-desc { font-size: 10.5px; color: var(--text-2); line-height: 1.3; }
.buy-btn { flex-shrink: 0; padding: 8px 10px; border: none; border-radius: 9px; background: linear-gradient(135deg, var(--green), #17a558); color: #fff; font-weight: 800; font-size: 11px; cursor: pointer; transition: .15s; font-family: inherit; min-width: 82px; white-space: nowrap; }
.buy-btn:disabled { background: rgba(255,255,255,.07); color: #5e5b74; cursor: not-allowed; }
.achievements-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.ach { display: flex; gap: 8px; align-items: center; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 8px 10px; }
.ach.locked { opacity: .45; }
.ach.unlocked { background: linear-gradient(135deg, rgba(255,215,0,.1), rgba(255,140,0,.05)); border-color: rgba(255,215,0,.35); }
.ach-icon { font-size: 18px; flex-shrink: 0; }
.ach-info { min-width: 0; }
.ach-name { font-weight: 700; font-size: 11px; margin-bottom: 2px; }
.ach-desc { font-size: 9.5px; color: var(--text-2); }
.stat-row { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 10px 14px; margin-bottom: 6px; font-size: 12px; color: var(--text-3); }
.stat-row b { color: var(--gold); font-size: 14px; }
.setting-row { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 12px 14px; margin-bottom: 6px; font-size: 13px; }
.toggle { width: 44px; height: 24px; background: rgba(255,255,255,.1); border-radius: 12px; position: relative; cursor: pointer; transition: .2s; border: none; padding: 0; }
.toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; background: #fff; border-radius: 50%; transition: .2s; }
.toggle.on { background: var(--green); }
.toggle.on::after { left: 23px; }
.action-btn { width: 100%; padding: 10px; border: none; border-radius: 10px; background: linear-gradient(135deg, var(--purple), var(--purple-d)); color: #fff; font-weight: 700; font-size: 12px; cursor: pointer; transition: .15s; font-family: inherit; margin-top: 6px; }
.action-btn.danger { background: linear-gradient(135deg, var(--red), #c9184a); }
.action-btn.gold { background: linear-gradient(135deg, #ffb800, #e67e00); color: #1a1030; }
.modal { position: fixed; inset: 0; background: rgba(5,4,12,.85); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 16px; }
.modal.hidden { display: none; }
.modal-box { background: linear-gradient(160deg, #1b1730, #12101f); border: 1px solid rgba(140,110,255,.35); border-radius: 18px; padding: 20px; width: 100%; max-width: 420px; max-height: 86vh; overflow-y: auto; animation: pop .2s ease; }
@keyframes pop { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }
.modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.modal-head h2 { font-size: 17px; color: #c4b5fd; }
.close-btn { background: rgba(255,255,255,.07); border: none; color: var(--text-3); width: 30px; height: 30px; border-radius: 8px; cursor: pointer; font-size: 14px; }
.admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 12px; }
.admin-btn { padding: 9px; border: none; border-radius: 9px; background: linear-gradient(135deg, var(--purple), var(--purple-d)); color: #fff; font-weight: 700; font-size: 11px; cursor: pointer; transition: .15s; font-family: inherit; }
.admin-btn.danger { background: linear-gradient(135deg, var(--red), #c9184a); grid-column: span 2; }
.admin-btn.gold { background: linear-gradient(135deg, #ffb800, #e67e00); color: #1a1030; }
.admin-field { margin-bottom: 10px; }
.admin-field label { display: block; font-size: 10px; color: var(--text-2); margin-bottom: 4px; font-weight: 600; text-transform: uppercase; }
.admin-field .row { display: flex; gap: 6px; }
.admin-field input { flex: 1; padding: 8px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,.12); background: rgba(0,0,0,.35); color: #fff; font-size: 12px; font-family: inherit; outline: none; min-width: 0; }
.admin-field .admin-btn { flex-shrink: 0; padding: 8px 14px; }
.float { position: fixed; pointer-events: none; font-weight: 900; font-size: 20px; color: var(--gold); text-shadow: 0 0 12px rgba(255,180,0,.9), 0 2px 4px rgba(0,0,0,.6); z-index: 999; animation: floatUp .8s cubic-bezier(.2,.7,.4,1) forwards; transform: translate(-50%, -50%); will-change: transform, opacity; }
.float.crit { color: #ff5fa2; font-size: 26px; }
@keyframes floatUp { 0% { opacity: 1; transform: translate(-50%, -50%) scale(.7); } 100% { opacity: 0; transform: translate(-50%, -170%) scale(1); } }
.wheel-container { position: relative; width: 260px; height: 260px; margin: 0 auto 20px; }
.wheel { width: 100%; height: 100%; border-radius: 50%; border: 4px solid var(--gold); box-shadow: 0 0 30px rgba(255,215,0,.5); transition: transform 4s cubic-bezier(.17,.67,.3,1); position: relative; overflow: hidden; }
.wheel-segment { position: absolute; width: 50%; height: 50%; top: 0; left: 50%; transform-origin: 0 100%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.7); padding-bottom: 30px; padding-left: 10px; }
.wheel-pointer { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); font-size: 30px; z-index: 10; filter: drop-shadow(0 2px 4px rgba(0,0,0,.7)); }
.chest-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
.chest { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 14px 8px; text-align: center; cursor: pointer; transition: .15s; }
.chest:hover { border-color: var(--gold); transform: translateY(-2px); }
.chest-icon { font-size: 36px; margin-bottom: 6px; display: block; }
.chest-name { font-size: 11px; font-weight: 700; margin-bottom: 4px; }
.chest-price { font-size: 11px; color: var(--gold); font-weight: 700; }
.quest { display: flex; align-items: center; gap: 10px; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 12px; margin-bottom: 8px; }
.quest.done { border-color: var(--green); background: rgba(46,204,113,.08); }
.quest-icon { font-size: 24px; }
.quest-info { flex: 1; min-width: 0; }
.quest-name { font-weight: 700; font-size: 12px; margin-bottom: 4px; }
.quest-progress { font-size: 10.5px; color: var(--text-2); margin-bottom: 5px; }
.quest-bar { height: 5px; background: rgba(255,255,255,.08); border-radius: 3px; overflow: hidden; }
.quest-bar-fill { height: 100%; background: linear-gradient(90deg, var(--green), #7dffb0); transition: width .3s; }
.quest-claim { padding: 7px 10px; border: none; border-radius: 8px; background: linear-gradient(135deg, var(--green), #17a558); color: #fff; font-weight: 800; font-size: 10px; cursor: pointer; flex-shrink: 0; }
.quest-claim:disabled { background: rgba(255,255,255,.07); color: #5e5b74; cursor: not-allowed; }
.daily-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 14px; }
.daily-day { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 10px 4px; text-align: center; font-size: 10px; font-weight: 700; }
.daily-day.claimed { background: rgba(46,204,113,.15); border-color: var(--green); opacity: .7; }
.daily-day.today { border-color: var(--gold); box-shadow: 0 0 15px rgba(255,215,0,.3); }
.daily-day-icon { font-size: 18px; display: block; margin-bottom: 3px; }
.daily-day-num { font-size: 9px; color: var(--text-2); }
.shop-item { display: flex; align-items: center; gap: 10px; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 12px; margin-bottom: 8px; }
.shop-item-bought { opacity: .5; }
.shop-item-icon { font-size: 28px; }
.shop-item-info { flex: 1; }
.shop-item-name { font-weight: 700; font-size: 13px; margin-bottom: 3px; }
.shop-item-desc { font-size: 10.5px; color: var(--text-2); }
.shop-item-price { font-size: 12px; color: var(--gold); font-weight: 800; margin-top: 4px; }
.shop-buy { padding: 8px 12px; border: none; border-radius: 9px; background: linear-gradient(135deg, var(--green), #17a558); color: #fff; font-weight: 800; font-size: 11px; cursor: pointer; }
.shop-buy:disabled { background: rgba(255,255,255,.07); color: #5e5b74; cursor: not-allowed; }
.timer-badge { display: inline-block; background: rgba(255,255,255,.08); padding: 2px 8px; border-radius: 20px; font-size: 10px; color: var(--text-2); margin-top: 4px; }
.skin-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.skin-item { background: var(--card-bg); border: 2px solid var(--card-border); border-radius: 12px; padding: 12px; text-align: center; cursor: pointer; transition: .15s; }
.skin-item.active { border-color: var(--gold); box-shadow: 0 0 15px rgba(255,215,0,.3); }
.skin-item.locked { opacity: .5; }
.skin-preview { width: 60px; height: 60px; border-radius: 50%; margin: 0 auto 8px; display: flex; align-items: center; justify-content: center; font-size: 28px; }
.skin-name { font-size: 12px; font-weight: 700; margin-bottom: 3px; }
.skin-price { font-size: 11px; color: var(--gold); font-weight: 700; }
@media (min-width: 821px) { .app { grid-template-columns: 1fr 1fr; } .left-panel { position: sticky; top: 16px; } .chest-grid { grid-template-columns: repeat(3, 1fr); } }
</style>
</head>
<body class="theme-dark">

<canvas id="particles"></canvas>
<div id="notifications"></div>
<div id="goldenCoin" class="golden-coin hidden">🪙</div>

<div class="app">
  <div class="left-panel">
    <h1 id="logo">🪙 КЛИКЕР v3.0</h1>
    <div class="player-info">
      <span>Ур. <b id="playerLevel">1</b></span><span>·</span>
      <span>⭐ <b id="prestigePoints">0</b></span><span>·</span>
      <b id="prestigeMult">×1.00</b>
    </div>
    <div class="coin-count"><span id="coins">0</span></div>
    <div class="coin-label">монет</div>
    <button id="clickBtn" class="click-btn skin-default">🪙</button>
    <div class="combo-bar"><div class="combo-fill" id="comboFill"></div></div>
    <div class="combo-indicator" id="comboIndicator"></div>
    <div class="hud">
      <div class="hud-item"><span class="hud-label">За клик</span><span id="perClick">1</span></div>
      <div class="hud-item"><span class="hud-label">В секунду</span><span id="perSec">0</span></div>
      <div class="hud-item"><span class="hud-label">Крит</span><span id="critChance">0%</span></div>
    </div>
  </div>

  <div class="right-panel">
    <div class="tabs">
      <button class="tab active" data-tab="shop">🛒</button>
      <button class="tab" data-tab="quests">📋</button>
      <button class="tab" data-tab="chests">🎁</button>
      <button class="tab" data-tab="wheel">🎡</button>
      <button class="tab" data-tab="daily">📅</button>
      <button class="tab" data-tab="achievements">🏆</button>
      <button class="tab" data-tab="stats">📊</button>
      <button class="tab" data-tab="settings">⚙️</button>
    </div>
    <div id="tab-shop" class="tab-content active"><div id="shop" class="shop"></div></div>
    <div id="tab-quests" class="tab-content"><div id="quests"></div></div>
    <div id="tab-chests" class="tab-content"><div id="chests" class="chest-grid"></div></div>
    <div id="tab-wheel" class="tab-content"><div id="wheelTab"></div></div>
    <div id="tab-daily" class="tab-content"><div id="dailyTab"></div></div>
    <div id="tab-achievements" class="tab-content"><div id="achievements" class="achievements-grid"></div></div>
    <div id="tab-stats" class="tab-content"><div id="stats"></div></div>
    <div id="tab-settings" class="tab-content">
      <div class="setting-row"><span>🔊 Звуки</span><button class="toggle on" id="soundToggle"></button></div>
      <div class="setting-row"><span>🎵 Музыка</span><button class="toggle" id="musicToggle"></button></div>
      <div class="setting-row"><span>✨ Частицы</span><button class="toggle on" id="particlesToggle"></button></div>
      <div class="setting-row"><span>🎨 Тема</span>
        <select id="themeSelect" style="background:rgba(0,0,0,.3);color:#fff;border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:6px;font-family:inherit;font-size:12px;">
          <option value="dark">Тёмная</option><option value="light">Светлая</option><option value="neon">Неон</option><option value="sunset">Закат</option>
        </select>

  const DAILY_REWARDS = [
    { icon:'🪙', amount:1000 }, { icon:'💰', amount:5000 }, { icon:'💎', amount:15000 },
    { icon:'🎁', amount:50000 }, { icon:'⭐', amount:100000 }, { icon:'👑', amount:500000 }, { icon:'🏆', amount:2000000 }
  ];

  const DEFAULT_STATE = {
    coins:0, totalEarned:0, clicks:0,
    levels: { click:0, auto:0, multi:0, crit:0, megaClick:0, combo:0, factory:0, luck:0, goldenMagnet:0, hyperClick:0, quantum:0, turbo:0, bank:0, singularity:0 },
    prestige: { points:0, count:0 }, achievements: [],
    records: { coins:0, totalEarned:0, clicks:0, perSec:0, maxCombo:0, goldenCoins:0 },
    playtime: 0, combo: 0, lastClick: 0,
    settings: { sound:true, music:false, particles:true, theme:'dark', skin:'default' },
    lastSave: Date.now(), playerLevel: 1, playerXP: 0,
    dailyClaimed: 0, lastDailyClaim: 0, dailyStreak: 0,
    quests: [], questProgress: {}, questsRefreshTime: 0,
    boosts: {}, lastTimedShopRefresh: 0, timedShopBought: [],
    lastWheelSpin: 0, lastChestOpen: 0, skinsOwned: []
  };

  let state = JSON.parse(JSON.stringify(DEFAULT_STATE));
  const $ = id => document.getElementById(id);

  function totalLevels(s) { return Object.values(s.levels).reduce((a,b)=>a+b,0); }
  function fmt(n) {
    if (!isFinite(n)) return '∞';
    n = Math.floor(n);
    if (n < 1000) return n.toString();
    const units = ['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc','Ud','Dd','Td','Qad','Qid','Sxd','Spd','Ocd','Nod','Vg'];
    let i = 0;
    while (n >= 1000 && i < units.length - 1) { n /= 1000; i++; }
    return n.toFixed(2).replace(/\.?0+$/,'') + units[i];
  }
  function fmtTime(sec) {
    sec = Math.floor(sec);
    const d = Math.floor(sec/86400), h = Math.floor((sec%86400)/3600), m = Math.floor((sec%3600)/60), s = sec%60;
    if (d > 0) return `${d}д ${h}ч`;
    if (h > 0) return `${h}ч ${m}м`;
    if (m > 0) return `${m}м ${s}с`;
    return `${s}с`;
  }
  function setCached(id, value) {
    if (CACHE[id] === value) return false;
    CACHE[id] = value;
    const el = $(id);
    if (el) el.textContent = value;
    return true;
  }

  function getPrestigeMult() { return 1 + state.prestige.points * 0.2; }
  function getAchievementMult() { return 1 + state.achievements.length * 0.01; }
  function getTurboMult() { return 1 + state.levels.turbo * 0.25; }
  function getBankMult() { return 1 + state.levels.bank * 0.1; }
  function getMultiMult() { return Math.pow(2, state.levels.multi); }
  function getLevelMult() { return 1 + state.playerLevel * 0.05; }
  function getBoostMult(type) {
    const b = state.boosts[type];
    if (!b || b.until < Date.now()) return 1;
    return 2;
  }
  function getClickPower() {
    const base = 1 + state.levels.click + state.levels.megaClick*10 + state.levels.hyperClick*500;
    const combo = 1 + Math.min(state.combo, getMaxCombo()) * 0.01;
    return Math.floor(base * getMultiMult() * getTurboMult() * getPrestigeMult() * getAchievementMult() * getLevelMult() * combo * getBoostMult('clickBoost'));
  }
  function getAutoRate() {
    const base = state.levels.auto + state.levels.factory*15 + state.levels.quantum*500 + state.levels.singularity*50000;
    return base * getMultiMult() * getTurboMult() * getPrestigeMult() * getAchievementMult() * getBankMult() * getLevelMult() * getBoostMult('autoBoost');
  }
  function getCritChance() { return Math.min((state.levels.crit*0.05) + (state.levels.luck*0.03), 0.75); }
  function getCritMultiplier() { return 10 + state.levels.luck*2; }
  function getMaxCombo() { return 10 + state.levels.combo*5; }
  function getCost(u) { return Math.floor(u.base * Math.pow(u.growth, state.levels[u.id])); }
  function getPrestigeGain() { return Math.floor(Math.cbrt(state.totalEarned / 1e6)); }

  function xpForNextLevel() { return Math.floor(100 * Math.pow(state.playerLevel, 1.5)); }
  function addXP(xp) {
    state.playerXP += xp;
    while (state.playerXP >= xpForNextLevel()) {
      state.playerXP -= xpForNextLevel();
      state.playerLevel++;
      // Уведомление о новом уровне УБРАНО
    }
  }

  function save() { try { state.lastSave = Date.now(); localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch(e) {} }
  function load() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return;
      const d = JSON.parse(raw);
      state = Object.assign({}, DEFAULT_STATE, d);
      state.levels = Object.assign({}, DEFAULT_STATE.levels, d.levels || {});

  }

  let audioCtx = null;
  function getAudio() { if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} } return audioCtx; }
  function beep(freq, dur, type) {
    if (!state.settings.sound) return;
    const ac = getAudio(); if (!ac) return;
    const osc = ac.createOscillator(), gain = ac.createGain();
    osc.type = type || 'sine'; osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.06, ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
    osc.connect(gain); gain.connect(ac.destination);
    osc.start(); osc.stop(ac.currentTime + dur);
  }
  function sfxClick() { beep(800 + Math.random()*200, 0.05, 'sine'); }
  function sfxCrit() { beep(1200, 0.12, 'square'); }
  function sfxBuy() { beep(600, 0.08, 'triangle'); }

  let musicOsc = null, musicGain = null;
  function startMusic() {
    if (!state.settings.music || musicOsc) return;
    const ac = getAudio(); if (!ac) return;
    musicOsc = ac.createOscillator(); musicGain = ac.createGain();
    musicOsc.type = 'sine'; musicOsc.frequency.value = 220; musicGain.gain.value = 0.02;
    musicOsc.connect(musicGain); musicGain.connect(ac.destination); musicOsc.start();
    let step = 0; const notes = [220, 261, 293, 329, 349, 392, 440, 392, 349, 329, 293, 261];
    setInterval(() => { if (!state.settings.music || !musicOsc) return; musicOsc.frequency.setValueAtTime(notes[step % notes.length], ac.currentTime); step++; }, 500);
  }
  function stopMusic() { if (musicOsc) { try { musicOsc.stop(); } catch(e){} musicOsc = null; } musicGain = null; }

  const canvas = $('particles'), pctx = canvas.getContext('2d');
  let particles = [], particleRaf = null, canvasActive = true;
  function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  window.addEventListener('resize', resizeCanvas); resizeCanvas();
  function spawnParticles(x, y, count, colors) {
    if (!state.settings.particles) return;
    const free = 100 - particles.length, actual = Math.min(count, free);
    for (let i = 0; i < actual; i++) particles.push({ x, y, vx: (Math.random()-0.5)*8, vy: (Math.random()-0.5)*8 - 3, life: 1, size: 2 + Math.random()*3, color: colors[i % colors.length] });
    if (!particleRaf && canvasActive) loopParticles();
  }
  function loopParticles() {
    if (!canvasActive) { particleRaf = null; return; }
    if (particles.length === 0) { pctx.clearRect(0, 0, canvas.width, canvas.height); particleRaf = null; return; }
    pctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i]; p.x += p.vx; p.y += p.vy; p.vy += 0.25; p.life -= 0.025;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      pctx.globalAlpha = p.life; pctx.fillStyle = p.color;
      pctx.beginPath(); pctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI*2); pctx.fill();
    }
    pctx.globalAlpha = 1; particleRaf = requestAnimationFrame(loopParticles);
  }
  document.addEventListener('visibilitychange', () => { canvasActive = !document.hidden; if (canvasActive && particles.length > 0 && !particleRaf) loopParticles(); });

  function notify(text, type, duration) {

  function buildShop() {
    const shop = $('shop'), frag = document.createDocumentFragment();

      frag.appendChild(card);

    shop.innerHTML = ''; shop.appendChild(frag);
    UPGRADES.forEach(u => $('buy-' + u.id).addEventListener('click', () => buy(u.id)));

  function buildDaily() {
    const el = $('dailyTab'), now = Date.now(), last = state.lastDailyClaim;

      html += `<div class="daily-day ${claimed ? 'claimed' : ''} ${isToday ? 'today' : ''}"><span class="daily-day-icon">${r.icon}</span><div class="daily-day-num">День ${i+1}</div><div style="font-size:9px;color:#ffd86b;margin-top:2px;">${fmt(r.amount)}</div></div>`;

    $('importBtn').addEventListener('click', () => {
      const data = prompt('Вставьте сохранение:'); if (!data) return;
      try { const decoded = JSON.parse(decodeURIComponent(escape(atob(data.trim())))); if (decoded) { localStorage.setItem(SAVE_KEY, JSON.stringify(decoded)); location.reload(); } } catch(e) { alert('❌ Ошибка'); }
    });
    $('resetBtn').addEventListener('click', () => { if (confirm('Сбросить всё?')) { state = JSON.parse(JSON.stringify(DEFAULT_STATE)); save(); location.reload(); } });
    renderTimedShopInSettings();
  }

  let logoClicks = 0, logoTimer = null;
  function openAdmin() {
    const pass = prompt('🔒 Пароль:');
    if (pass === null) return;
    if (pass !== ADMIN_PASSWORD) { alert('❌ Неверный пароль'); return; }
    $('adminModal').classList.remove('hidden');
  }
  function initAdmin() {
    $('logo').addEventListener('click', () => { logoClicks++; clearTimeout(logoTimer); logoTimer = setTimeout(() => { logoClicks = 0; }, 1500); if (logoClicks >= 5) { logoClicks = 0; openAdmin(); } });
    document.addEventListener('keydown', e => { if (e.ctrlKey && e.shiftKey && (e.key === 'A' || e.key === 'a' || e.key === 'Ф' || e.key === 'ф')) { e.preventDefault(); openAdmin(); } });
    document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => $(b.dataset.close).classList.add('hidden')));
    document.querySelectorAll('.modal').forEach(m => m.addEventListener('click', e => { if (e.target === m) m.classList.add('hidden'); }));
    $('adminModal').addEventListener('click', e => {
      const btn = e.target.closest('[data-admin]'); if (!btn) return;
      switch (btn.dataset.admin) {
        case 'add1k': state.coins += 1e3; state.totalEarned += 1e3; break;
        case 'add1m': state.coins += 1e6; state.totalEarned += 1e6; break;
        case 'add1b': state.coins += 1e9; state.totalEarned += 1e9; break;
        case 'add1t': state.coins += 1e12; state.totalEarned += 1e12; break;
        case 'maxAll': UPGRADES.forEach(u => { state.levels[u.id] = u.max !== undefined ? u.max : 100; }); state.coins += 1e15; state.totalEarned += 1e15; break;
        case 'unlockAll': ACHIEVEMENTS.forEach(a => { if (!state.achievements.includes(a.id)) state.achievements.push(a.id); }); break;
        case 'addPrestige': state.prestige.points += 10; break;
        case 'spawnGolden': spawnGoldenCoin(); break;
        case 'addLevel': state.playerLevel += 5; break;
        case 'setCoins': { const v = parseFloat($('admCoins').value); if (!isNaN(v) && v >= 0) { if (v > state.coins) state.totalEarned += v - state.coins; state.coins = v; } break; }
        case 'setClick': { const v = parseInt($('admClick').value, 10); if (!isNaN(v) && v >= 0) state.levels.click = v; break; }
        case 'setAuto': { const v = parseInt($('admAuto').value, 10); if (!isNaN(v) && v >= 0) state.levels.auto = v; break; }
        case 'setMulti': { const v = parseInt($('admMulti').value, 10); if (!isNaN(v) && v >= 0) state.levels.multi = Math.min(v, 15); break; }
        case 'setPrestige': { const v = parseInt($('admPrestige').value, 10); if (!isNaN(v) && v >= 0) state.prestige.points = v; break; }
        case 'reset': if (confirm('Полный сброс?')) { state = JSON.parse(JSON.stringify(DEFAULT_STATE)); save(); location.reload(); return; } break;
      }
      updateAll(); save();
    });
  }

  function applyOfflineEarnings() {
    if (!state.lastSave) return;
    const offlineMs = Date.now() - state.lastSave, offlineSec = Math.min(offlineMs / 1000, 1 * 3600); // МАКС 1 ЧАС
    if (offlineSec < 30) return;
    const rate = getAutoRate(); if (rate <= 0) return;
    const earned = rate * offlineSec * 0.5; if (earned < 1) return;
    state.coins += earned; state.totalEarned += earned;
    setTimeout(() => notify('💤 Оффлайн: +' + fmt(earned) + ' (' + fmtTime(offlineSec) + ')', 'quest', 4500), 500);
  }

  function init() {
    load(); applyTheme(); applySkin(); applyOfflineEarnings();
    buildShop(); buildAchievements(); buildQuests(); refreshQuests(false);
    initTabs(); initSettings(); initAdmin();
    $('clickBtn').addEventListener('click', doClick);
    $('goldenCoin').addEventListener('click', collectGoldenCoin);
    updateAll(); setInterval(tick, 100); setInterval(save, 5000); scheduleGoldenCoin();
    if (state.settings.music) startMusic();
    window.addEventListener('beforeunload', save);
    document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
  }

  let tickCount = 0;
  function tick() {
    const rate = getAutoRate();
    if (rate > 0) { const gain = rate / 10; state.coins += gain; state.totalEarned += gain; state.questProgress.earn = (state.questProgress.earn || 0) + gain; }
    state.playtime += 0.1;
    // XP за автокликер ОТКЛЮЧЕН, чтобы не было спама уровнями
    if (Date.now() - state.lastClick > 1500 && state.combo > 0) state.combo = 0;
    updateAll(); tickCount++;
    if (tickCount % 20 === 0) { checkAchievements(); checkQuests(); }
  }

  init();
})();
</script>
</body>
  </html>
